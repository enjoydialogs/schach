# Lokal entwickeln (SCHACH-SPEC 13.4). Eingefroren ab Phase 0.
#
#   docker compose up -d                  postgres (:5432) und engine (:8081)
#   docker compose --profile full up -d   zusaetzlich web (:8080) aus dem Dockerfile
#
# Ohne `full` laeuft die API per `dotnet run --project src/Schach.Api` (:5252) gegen diese Dienste.
# Die PR-CI faehrt `--profile full` und den Rauchtest gegen diesen Stand (.github/workflows/ci.yml).
# Nur fuer den Entwicklungsrechner: Passwort und Ports sind bewusst einfach. Prod: docker-compose.dokploy.yml.

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    logging: *logging
    environment:
      POSTGRES_DB: schach
      POSTGRES_USER: schach
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-schach}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U schach -d schach"]
      interval: 5s
      timeout: 3s
      retries: 20

  engine:
    build:
      context: engine
      args:
        SF_ARCH: ${SF_ARCH:-x86-64-avx2}
    image: schach-engine:local
    restart: unless-stopped
    logging: *logging
    environment:
      MAIA_TORCH_THREADS: "1"
      MAIA_QUEUE_MAX: "32"
      SF_POOL_SIZE: "2"
      SF_MAX_MOVETIME_MS: "800"
      FAIRY_POOL_SIZE: "1"
      ENGINE_ROLES: "maia,stockfish,fairy"
      # Leer: echtes Maia-Modell (Download von Hugging Face beim ersten Start). Die PR-CI setzt 1:
      # Fixture statt Modell, kein Download (.github/workflows/ci.yml, Job images).
      SCHACH_ENGINE_FAKE_MODEL: ${SCHACH_ENGINE_FAKE_MODEL:-}
    ports:
      - "127.0.0.1:8081:8081"
    volumes:
      - engine-models:/models
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8081/healthz', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 120s
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G

  web:
    profiles: [full]
    build:
      context: .
      args:
        COMMIT_SHA: ${COMMIT_SHA:-}
    image: schach-web:local
    restart: unless-stopped
    logging: *logging
    environment:
      # Production-Pipeline (HSTS, Sicherheits-Header, SPA aus wwwroot), nur ohne TLS davor.
      ASPNETCORE_ENVIRONMENT: "Production"
      ConnectionStrings__Schach: "Host=postgres;Port=5432;Database=schach;Username=schach;Password=${POSTGRES_PASSWORD:-schach}"
      Engine__BaseUrl: "http://engine:8081"
      Logging__Console__FormatterName: "json"
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /healthz HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 && head -n 1 <&3 | grep -q ' 200 '"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 30s
    # Nicht vom Engine-Health abhaengig (SCHACH-SPEC 5.2).
    depends_on:
      postgres: { condition: service_healthy }

volumes:
  pgdata:
  engine-models:
