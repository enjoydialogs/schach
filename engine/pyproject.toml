# Engine-Dienst (SCHACH-SPEC 5.2), AGPL-3.0-or-later (engine/LICENSE). Vertrag: engine/API.md.
# Maia-3 (geaenderter CSSLab-Code in src/schach_engine/maia3/), Stockfish und Fairy-Stockfish.
# PyTorch steht nur im Extra `model`: CI und pytest laufen mit SCHACH_ENGINE_FAKE_MODEL=1 ohne Torch.
# Das Image installiert `.[model]` gegen den CPU-Index von PyTorch (engine/Dockerfile).
[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "schach-engine"
version = "0.1.0"
description = "Engine-Dienst fuer Schach: Maia-3, Stockfish und Fairy-Stockfish hinter HTTP"
license = "AGPL-3.0-or-later"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.162.1",
  "uvicorn>=0.54.0",
  "chess>=1.11.2",
]

[project.optional-dependencies]
model = [
  "torch>=2.15.0",
]
test = [
  "pytest>=9.2.0",
  "httpx>=0.28.1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests", "tools"]
addopts = "-q"
markers = [
  "model: braucht das echte Maia3-5M und PyTorch; laeuft nur mit SCHACH_ENGINE_MODEL_TESTS=1",
]
