# CI-Gate fuer jeden PR plus woechentlicher Drift-Lauf (SCHACH-SPEC 15.2). Eingefroren ab Phase 0.
#
# Oeffentliches Repo: nur GitHub-gehostete Runner (ubuntu-latest), nie Self-hosted.
# Cloud und lokal laufen dasselbe Skript: pwsh ci/local-ci.ps1 -All.
name: ci

on:
  pull_request:
  schedule:
    # Samstag 09:17 UTC: faengt neue SDK-Patches und Paket-Advisories ab, die nicht im Diff stehen.
    - cron: "17 9 * * 6"
  workflow_dispatch:
    inputs:
      stage:
        description: "Nur diese Stufen (kommagetrennt), leer = alle"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  local-ci:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Testcontainers-Tests laufen hier, lokal auf den Windows-Rechnern nicht.
      SCHACH_CONTAINER_TESTS: "1"
      DOTNET_NOLOGO: "1"
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          # ci/version.ps1 zaehlt `git rev-list --count HEAD`; gitleaks scannt die Historie.
          fetch-depth: 0

      # Nicht actions/setup-dotnet (Kronrat: dessen Fallback-Origin antwortete 2026-10 mit 409).
      # --jsonfile installiert genau das SDK aus global.json, keine andere Feature-Band.
      - name: Install .NET SDK from global.json
        shell: bash
        run: |
          curl -sSfL https://builds.dotnet.microsoft.com/dotnet/scripts/v1/dotnet-install.sh -o "$RUNNER_TEMP/dotnet-install.sh"
          dir="$HOME/.dotnet"
          bash "$RUNNER_TEMP/dotnet-install.sh" --jsonfile global.json --install-dir "$dir" --azure-feed https://builds.dotnet.microsoft.com/dotnet
          echo "$dir" >> "$GITHUB_PATH"
          echo "DOTNET_ROOT=$dir" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: src/Schach.Web/package-lock.json

      - name: Install gitleaks and shellcheck
        shell: bash
        env:
          GITLEAKS_VERSION: "8.30.1"
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends shellcheck
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin gitleaks
          gitleaks version

      - name: Run ci/local-ci.ps1
        shell: pwsh
        env:
          # Ueber env statt inline, damit die Eingabe nie als Skripttext ausgewertet wird.
          ONLY_STAGES: ${{ inputs.stage }}
        run: |
          if ($env:ONLY_STAGES) {
            ./ci/local-ci.ps1 -Only $env:ONLY_STAGES -NoColor
          } else {
            ./ci/local-ci.ps1 -All -NoColor
          }

      - name: Upload run logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: local-ci-logs
          path: |
            .local-ci/logs/
            TestResults/
          retention-days: 14

  # Beide Images bauen und den Stapel einmal hochfahren (SCHACH-SPEC 15.3, Phase 0 „Images bauen“).
  # Probt Deploy-Rauchtest und Engine-aus-web vor dem Merge; Docker laeuft nur hier, nie lokal auf
  # den Windows-Rechnern. Pusht nichts: das macht release.yml auf main.
  images:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v7

      - name: Prod-Compose pruefen (Syntax, keine veroeffentlichten Ports)
        env:
          # Nur Platzhalter, damit die Pflicht-Variablen aufloesen.
          REGISTRY: ghcr.io/example
          IMAGE_TAG: placeholder
          POSTGRES_PASSWORD: placeholder
          TRAEFIK_NETWORK: placeholder
        run: |
          docker compose -f docker-compose.dokploy.yml config -q
          docker compose -f docker-compose.dokploy.yml config --format json \
            | jq -e '[.services[] | select(has("ports"))] | length == 0' > /dev/null \
            || { echo "docker-compose.dokploy.yml veroeffentlicht einen Port" >&2; exit 1; }

      - name: Images bauen (web, engine)
        run: docker compose --profile full build

      - name: Stapel starten
        run: docker compose --profile full up -d --wait --wait-timeout 300

      - name: Rauchtest gegen localhost
        run: bash deploy/ops/rauchtest.sh http://localhost:8080

      - name: Engine-Health aus dem web-Container
        run: bash deploy/ops/engine-aus-web.sh "$(docker compose --profile full ps -q web)"

      - name: Container-Logs
        if: always()
        run: docker compose --profile full logs --no-color --tail 200

      - name: Aufraeumen
        if: always()
        run: docker compose --profile full down -v
